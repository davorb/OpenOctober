[package]
name = "game-server"
version = "0.1.0"
edition = "2021"
description = "Multiplayer relay server for the Darkfall game-viewer (tech demo: positions + chat, no anti-cheat)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
