<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Darkfall</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="/css/game.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body data-mode="player">
<canvas id="view"></canvas>
<div id="cross"></div>
<div id="banner"></div>
<canvas id="radar" width="140" height="140"></canvas>
<div id="net"><span id="mpnet"></span></div>
<div id="chat"><div id="chatlog"></div><input id="chatin" maxlength="200" placeholder="Say something… (Enter sends, Esc cancels)" autocomplete="off" spellcheck="false"></div>
<div id="plist"></div>
<div id="hud"><div id="place"></div><div id="sub"></div></div>
<div id="stats"></div>
<div id="track"></div>
<div id="help"></div>
<div id="modebtn">Mode: Fly (G)</div>
<div id="cfgbtn">Performance (O)</div>
<div id="cfg"></div>
<div id="intro">
  <h1>DARKFALL</h1>
  <div id="auth"></div>
  <div id="loading"><div id="load">Downloading game data…</div><div id="loadbar"><i></i></div></div>
  <div class="keys"><b>W</b><b>A</b><b>S</b><b>D</b> move &nbsp; <b>Shift</b> sprint &nbsp; <b>Space</b> jump &nbsp; <b>Ctrl</b> walk &nbsp; <b>C</b> crouch &nbsp; mouse to look<br>
  <b>Enter</b> chat &nbsp; <b>Tab</b> players &nbsp; <b>M</b> music &nbsp; <b>H</b> help &nbsp; <b>Esc</b> release mouse</div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
