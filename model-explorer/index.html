<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenOctober Asset Viewer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel2: #22262e; --line: #2d323c;
    --fg: #d9dce2; --dim: #8b919e; --accent: #d9a441; --accent2: #6aa3e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #brand { padding: 12px 14px 8px; font-weight: 600; letter-spacing: .04em; color: var(--accent); }
  #tabs { display: flex; gap: 4px; padding: 0 10px 8px; }
  .tab { flex: 1; padding: 6px 4px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 5px; cursor: pointer; font: inherit; }
  .tab.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  #q { margin: 0 10px 8px; padding: 7px 10px; background: var(--bg); border: 1px solid var(--line); color: var(--fg);
    border-radius: 5px; font: inherit; outline: none; }
  #q:focus { border-color: var(--accent2); }
  #count { padding: 0 14px 6px; color: var(--dim); font-size: 12px; }
  #list { flex: 1; overflow-y: auto; position: relative; min-height: 0; }
  #spacer { position: relative; }
  .row { position: absolute; left: 0; right: 0; height: 28px; padding: 0 14px; display: flex; align-items: center;
    justify-content: space-between; cursor: pointer; white-space: nowrap; }
  .row:hover { background: var(--panel2); }
  .row.on { background: #2b3342; box-shadow: inset 3px 0 var(--accent); }
  .row .n { overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--dim); font-size: 11px; margin-left: 8px; flex: none; }
  #main { position: relative; min-width: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hud { position: absolute; background: #14161ad9; border: 1px solid var(--line); border-radius: 7px;
    backdrop-filter: blur(6px); padding: 8px 10px; }
  #bar { top: 10px; left: 10px; right: 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  #bar h1 { margin: 0 8px 0 0; font-size: 14px; font-weight: 600; }
  #bar label { color: var(--dim); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; user-select: none; }
  #bar input[type=range] { width: 90px; }
  #bar select, #bar button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 8px; font: inherit; cursor: pointer; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  .seg button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .seg button[disabled] { opacity: .35; cursor: default; }
  #info { bottom: 10px; right: 10px; width: 300px; max-height: 45%; overflow-y: auto; font-size: 12px; }
  #info h3 { margin: 0 0 4px; font-size: 12px; color: var(--accent); font-weight: 600; }
  #info .kv { color: var(--dim); }
  #info .kv b { color: var(--fg); font-weight: 500; }
  #info .warn { color: #e0776b; }
  #texs { display: grid; grid-template-columns: repeat(auto-fill, 56px); gap: 6px; margin-top: 6px; }
  #texs img { width: 56px; height: 56px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line);
    background: #000 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="4" height="4" fill="%23333"/><rect x="4" y="4" width="4" height="4" fill="%23333"/></svg>'); cursor: zoom-in; }
  #hint { bottom: 10px; left: 10px; color: var(--dim); font-size: 12px; }
  #status { top: 64px; left: 50%; transform: translateX(-50%); display: none; }
  #zoom { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 9; flex-direction: column; gap: 8px; }
  #zoom img { max-width: 80vw; max-height: 80vh; image-rendering: pixelated; border: 1px solid var(--line); background: #000; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 38% 62%; }
    #info { width: 220px; } #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand">OPENOCTOBER · ASSET VIEWER</div>
    <div id="tabs"></div>
    <input id="q" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
    <div id="count"></div>
    <div id="list"><div id="spacer"></div></div>
  </aside>
  <main id="main">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="bar" class="hud">
      <h1 id="title">Select an asset</h1>
      <span id="variants" class="seg"></span>
      <label id="lblTerrain"><input type="checkbox" id="tTerrain" checked> Terrain</label>
      <label id="lblWater"><input type="checkbox" id="tWater" checked> Water</label>
      <label id="lblObjects"><input type="checkbox" id="tObjects" checked> Objects</label>
      <label><input type="checkbox" id="tWire"> Wireframe</label>
      <label><input type="checkbox" id="tGrid"> Grid</label>
      <label id="lblTint" title="Multiply terrain by its baked per-vertex colour"><input type="checkbox" id="tTint" checked> Terrain tint</label>
      <label id="lblScale" title="World units per terrain texture repeat">Tex size <input type="range" id="rScale" min="2" max="64" step="1" value="16"></label>
      <select id="bg"><option value="sky">Sky</option><option value="grey">Grey</option><option value="dark">Dark</option></select>
      <button id="shot" title="Save PNG screenshot">📷</button>
    </div>
    <div id="status" class="hud"></div>
    <div id="info" class="hud" hidden></div>
    <div id="hint" class="hud">Drag: orbit · Right-drag: pan · Wheel: zoom · W/A/S/D + Q/E: fly (Shift = fast) · F: re-frame</div>
  </main>
</div>
<div id="zoom"><img id="zimg" alt=""><div id="zname" class="kv"></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
