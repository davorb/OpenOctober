[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Multiplayer relay server for the OpenOctober game (tech demo: positions + chat, no anti-cheat)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"

[profile.release]
opt-level = 3

# argon2 is far too slow unoptimised: keep password hashing fast in debug builds / tests
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
